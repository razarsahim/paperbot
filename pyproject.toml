[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-paper-bot"
version = "0.1.0"
description = "Long-only, no-leverage BTC/GBP crypto paper-trading research bot"
requires-python = ">=3.10"
dependencies = ["ccxt>=4.4,<5", "streamlit>=1.40,<2", "pandas>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
paperbot = "paperbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
